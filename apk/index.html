<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark" />
    <!-- Абсолютные пути с ведущим / → Vite подставит build-base (/, /miniapp/,
         /app/, /tg/), поэтому manifest/иконки резолвятся под любой целью, в т.ч.
         в окне exe на /miniapp (относительный ./ ломался → 404). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- PWA: веб-версия на remotai.ru/app ставится на главный экран -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Remotai" />
    <!-- Бренд-шрифты: Unbounded (заголовки), Golos Text (текст), JetBrains Mono
         (код). Подключение НЕ блокирующее: media="print" не задерживает первую
         отрисовку, onload переводит стиль в "all". Обычный <link rel=stylesheet>
         блокировал рендер (и выполнение скриптов) до сетевого таймаута, поэтому
         в сети без доступа к fonts.googleapis.com (офлайн-LAN, корпоративный
         фильтр, DPI) экран оставался пустым. Фолбэк — системный стек в CSS. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <title>Remotai</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
