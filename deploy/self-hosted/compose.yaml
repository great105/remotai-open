name: remotai-self-hosted

services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/relay.Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8090"
      DB_PATH: /data/relay.db
      PUBLIC_URL: ${PUBLIC_URL:?Run scripts/init-self-hosted.mjs first}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET:?Run scripts/init-self-hosted.mjs first}
      SELF_HOSTED: "true"
      BILLING_ENABLED: "false"
      CORS_ORIGINS: ${PUBLIC_URL}
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_USERNAME: ${BOT_USERNAME:-}
      MINIAPP_URL: ${PUBLIC_URL}/app/
      ADMIN_IDS: ${ADMIN_IDS:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - relay_data:/data
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: deploy/self-hosted/web.Dockerfile
      args:
        PUBLIC_URL: ${PUBLIC_URL}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Run scripts/init-self-hosted.mjs first}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy

volumes:
  relay_data:
  caddy_data:
  caddy_config:
